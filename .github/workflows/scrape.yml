name: Pobierz szczęśliwe numerki

on:
  schedule:
    - cron: "10 * * * *"   # co godzine (czas UTC)
  workflow_dispatch: {}      # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz numerki
        run: python scrape.py
      - name: Zapisz zmiany
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "numerki-bot"
            git config user.email "numerki-bot@users.noreply.github.com"
            git add data/numerki.json data/numerki.js
            git commit -m "Aktualizacja numerków $(date -u +%F\ %H:%M)"
            git push
          else
            echo "Brak zmian."
          fi
